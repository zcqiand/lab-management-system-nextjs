name: ci

# lab-management-system-nextjs (Next.js 15 full-stack)
# 推送链:
# - branch push(master/main)→ 只跑 test(对齐门禁 L1-L4)
# - tag push(v<X>.<Y>.<Z>-<YYYYMMDD> per tag.md §1)  → test + docker build & push + VPS 部署
# 镜像名/SSH 路径/部署脚本用 ${{ github.event.repository.name }} 避免跨仓劫持(saas 仓历史踩坑)。
on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # generated/schema.ts 是 drizzle-kit pull 产出（gitignored,见 CLAUDE.md §3），
    # src/db/schema.ts:7 export * from "../../generated/schema"。CI 起 postgres 服务
    # 跑 migrate + pull schema，再 build/typecheck。DB host/port/credentials 由
    # services.postgres 自动注入到 DATABASE_URL。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lab_test
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node 24 与本仓 lockfile 一致;npm 11 解析正常(见 CLAUDE.md §5)
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmmirror.com/
      # shared 仓作为 sibling 被 checkout(gen:shared 读 ../lab-management-system-shared/...)
      # multi-repo-family.md §2 强制 sibling 引用,不以包依赖 import
      - name: Checkout shared sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/lab-management-system-shared.git ../lab-management-system-shared
      - name: Checkout msw sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/lab-management-system-msw.git ../lab-management-system-msw
      - name: Install dependencies
        run: npm ci
      # shared-openapi.yaml 生成 src/api/endpoints/(gitignored,见 CLAUDE.md §3)
      - name: gen:shared
        run: npm run gen:shared
      # 把 shared 的 V*.sql 灌到 CI postgres,再建表 drizzle schema
      # sync-db.mjs 在 sibling 仓 ../lab-management-system-shared/scripts/（CLAUDE.md §4）
      - name: sync-db (CI postgres)
        run: node ../lab-management-system-shared/scripts/sync-db.mjs
      # drizzle-kit pull:从已 migrate 的 CI postgres 拉 schema 到 generated/schema.ts
      # 这是 src/db/schema.ts:7 export * from "../../generated/schema" 的 SSOT
      - name: drizzle-kit pull → generated/schema.ts
        run: npx --no drizzle-kit pull --config=drizzle.config.pg.ts
      # drizzle-kit 解析 V009/V012 的 `DEFAULT ''` 会有 bug,产出 `default(').notNull()`
      # 而不是合法的 `default('').notNull()`。sed 修。
      # 等待 drizzle-kit 升级修这个再撤补丁。
      - name: Fix drizzle-kit DEFAULT '' bug
        run: sed -i "s/default(')\./default('')./g" generated/schema.ts
      # drizzle-kit 在某些版本会 import `sql` 但实际未用,tsc L3 报
      # "'sql' is declared but its value is never read"。sed 移除整行。
      - name: Drop unused `sql` import from generated/schema.ts
        run: sed -i "/^import { sql } from \"drizzle-orm\";$/d" generated/schema.ts
      # Build —— next build 会 import src/db/schema.ts,需要 generated/schema.ts 已就位
      - name: Build
        run: npm run build
      - name: L1 format
        run: npx --no prettier --check src tests
      - name: L2 lint
        run: npx --no eslint src tests
      - name: L3 typecheck
        run: npx --no tsc --noEmit
      - name: L4 test
        run: npx --no vitest run

  # tag push → test 绿 → docker build & push → VPS pull + restart
  # env 文件自举由 deploy/<repo>.sh 脚本自己处理(VPS 上脚本是 repo 副本,删 inline 让脚本权威)
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # 防 GITHUB_TOKEN 泄露到后续 step

      # secrets 全部建在 Repository 级,不声明 environment
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # 不传 fingerprint,走 TOFU
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            # lab.env: deploy script 自己会生成随机 AUTH_JWT_SECRET,无需 secret
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            if [ ! -f "$REPO.sh" ]; then
              curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
              chmod +x "$REPO.sh"
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
